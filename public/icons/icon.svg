<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(16, 185, 129, 0.15)" stroke-width="2" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(99, 102, 241, 0.15)" stroke-width="2" />

  <!-- Stylized Wallet & Finance Graphic -->
  <g transform="translate(116, 120)">
    <!-- Wallet base card -->
    <rect x="0" y="40" width="280" height="190" rx="28" fill="url(#primaryGrad)" filter="url(#glow)" />
    <!-- Flap overlay -->
    <path d="M 0 68 C 0 52.5 12.5 40 28 40 L 252 40 C 267.5 40 280 52.5 280 68 L 280 110 C 240 110 200 135 150 135 C 100 135 40 110 0 110 Z" fill="rgba(255,255,255,0.18)" />
    
    <!-- Currency / Growth Symbol Inside -->
    <circle cx="200" cy="135" r="24" fill="#0f172a" />
    <circle cx="200" cy="135" r="14" fill="#34d399" />
    
    <!-- Rising Graph Bars -->
    <rect x="40" y="145" width="16" height="45" rx="8" fill="#ffffff" opacity="0.9" />
    <rect x="70" y="115" width="16" height="75" rx="8" fill="#ffffff" opacity="0.95" />
    <rect x="100" y="85" width="16" height="105" rx="8" fill="#ffffff" />
    
    <!-- Growth Sparkle -->
    <path d="M 125 65 Q 135 75 145 65 Q 135 55 125 65 Z" fill="#fcd34d" />
  </g>
</svg>