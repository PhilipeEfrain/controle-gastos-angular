@if (shouldRender()) {
  <aside
    class="ad-banner-wrapper"
    [class]="cssClass()"
    [class.is-leaderboard]="activeFormat() === 'leaderboard'"
    [class.is-rectangle]="activeFormat() === 'rectangle'"
    [class.is-skyscraper]="activeFormat() === 'skyscraper'"
    role="complementary"
    aria-label="Espaço publicitário"
  >
    <div class="ad-banner-card">
      <div class="ad-banner-meta">
        <span class="ad-tag">Publicidade</span>
        @if (showUpgradePrompt()) {
          <button
            type="button"
            class="btn-ad-upgrade"
            (click)="onUpgrade()"
            title="Assine o Plano PRO para remover os anúncios"
          >
            <span>Remover anúncios com o PRO</span>
            <span class="sparkle">✨</span>
          </button>
        }
      </div>

      <div
        class="ad-banner-content"
        [class.format-leaderboard]="activeFormat() === 'leaderboard'"
        [class.format-rectangle]="activeFormat() === 'rectangle'"
        [class.format-skyscraper]="activeFormat() === 'skyscraper'"
      >
        <div #adContainer class="ad-slot-frame">
          @if (isAdBlocked()) {
            <div class="ad-blocked-fallback">
              <span class="ad-fallback-icon">🛡️</span>
              <div class="ad-fallback-text">
                <strong>Bloqueador de anúncios ativo</strong>
                <small>Para apoiar o desenvolvimento do Quinzena, experimente o Plano PRO sem anúncios</small>
              </div>
              <button type="button" class="btn-fallback-upgrade" (click)="onUpgrade()">
                Conhecer PRO
              </button>
            </div>
          }
        </div>
      </div>
    </div>
  </aside>
}
