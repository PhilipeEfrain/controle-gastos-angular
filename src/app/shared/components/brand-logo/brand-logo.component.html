<div class="brand-logo-container" [attr.data-size]="size()">
  <!-- Símbolo Oficial Quinzena (Vetor Exato) -->
  <div class="symbol-box">
    @if (isDark) {
      <!-- Símbolo para Fundo Escuro (Anel Branco, Corte Verde Ciclo, Ponto Lima Sinal) -->
      <svg class="brand-symbol" viewBox="0 0 260 260" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g clip-path="url(#clip_symbol_white)">
          <circle cx="192.4" cy="59.7999" r="28.6" fill="#D9F99D"/>
          <rect x="111.8" y="26" width="36.4" height="208" rx="18.2" transform="rotate(-28 111.8 26)" fill="#173F35"/>
          <circle cx="130" cy="130" r="109.2" stroke="white" stroke-width="41.6"/>
        </g>
        <defs>
          <clipPath id="clip_symbol_white">
            <rect width="260" height="260" fill="white"/>
          </clipPath>
        </defs>
      </svg>
    } @else {
      <!-- Símbolo para Fundo Claro (Anel Verde Ciclo, Corte Areia Calma, Ponto Lima Sinal) -->
      <svg class="brand-symbol" viewBox="0 0 230 230" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g clip-path="url(#clip_symbol_dark)">
          <circle cx="170.2" cy="52.9" r="25.3" fill="#D9F99D"/>
          <rect x="98.8999" y="23" width="32.2" height="184" rx="16.1" transform="rotate(-28 98.8999 23)" fill="#F5F2E9"/>
          <circle cx="115" cy="115" r="96.6" stroke="#173F35" stroke-width="36.8"/>
        </g>
        <defs>
          <clipPath id="clip_symbol_dark">
            <rect width="230" height="230" fill="white"/>
          </clipPath>
        </defs>
      </svg>
    }
  </div>

  @if (showText()) {
    <div class="brand-text-block">
      <span class="brand-name">Quinzena</span>
      @if (showTagline()) {
        <span class="brand-tagline">Saiba quanto entra, quanto sai e quanto sobra.</span>
      }
    </div>
  }
</div>
