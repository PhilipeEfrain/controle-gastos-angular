@if (isFreeUser() && isVisible()) {
  <aside
    class="ad-sidebar"
    [class.ad-sidebar--left]="position() === 'left'"
    [class.ad-sidebar--right]="position() === 'right'"
    role="complementary"
    [attr.aria-label]="'Publicidade lateral ' + position()"
  >
    <div class="ad-sidebar-inner">
      <span class="ad-sidebar-tag">Publicidade</span>

      <div class="ad-sidebar-slot">
        <ins class="adsbygoogle"
             style="display:block"
             [attr.data-ad-client]="adClient()"
             [attr.data-ad-slot]="slotId()"
             data-ad-format="vertical"
             data-full-width-responsive="false"></ins>

        @if (isAdBlocked()) {
          <div class="ad-sidebar-fallback">
            <span class="ad-fallback-icon">🛡️</span>
            <small>Bloqueador ativo</small>
          </div>
        }
      </div>
    </div>
  </aside>
}
