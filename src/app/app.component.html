<div class="app-shell">
  <app-offline-banner />

  @if (showNavbar()) {
    <app-navbar />
  }

  <main class="main-content" [class.authenticated-layout]="showNavbar()">
    <router-outlet />
  </main>

  <!-- Anúncios Laterais Fixos - App Autenticado (Plano Free em telas amplas) -->
  @if (showAdSidebar()) {
    <app-ad-sidebar position="left" />
    <app-ad-sidebar position="right" />
  }

  <app-toast-container />

  @if (showNavbar()) {
    <app-feedback-fab />
  }
</div>
