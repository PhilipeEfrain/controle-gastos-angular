<div class="app-shell">
  <app-offline-banner />

  @if (showNavbar()) {
    <app-navbar />
  }

  <main class="main-content" [class.authenticated-layout]="showNavbar()">
    <router-outlet />
  </main>

  <!-- Anúncios Laterais - Módulo Dividir (sempre) ou App Autenticado (Plano Free) -->
  @if (showAdSidebar()) {
    <app-ad-sidebar position="left" [alwaysShow]="isDividirPage()" />
    <app-ad-sidebar position="right" [alwaysShow]="isDividirPage()" />
  }

  <app-toast-container />

  @if (showNavbar()) {
    <app-feedback-fab />
  }
</div>
